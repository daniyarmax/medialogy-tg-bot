name: media-bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_bot}
      POSTGRES_USER: ${POSTGRES_USER:-media_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-download:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "downloads", "--concurrency=4", "--loglevel=INFO"]
    env_file: .env
    volumes:
      - storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-processing:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "processing,maintenance", "--concurrency=2", "--loglevel=INFO"]
    env_file: .env
    volumes:
      - storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Opt-in: raises Telegram's upload limit from 50MB to 2000MB. Requires
  # TELEGRAM_API_ID/TELEGRAM_API_HASH in .env (from https://my.telegram.org/apps
  # - a personal account's credentials, NOT the bot token) and
  # TELEGRAM_API_MODE=local so the bot/workers point at this server instead
  # of api.telegram.org. Enable with: docker compose --profile local-api up
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${LOCAL_BOT_API_ID}
      TELEGRAM_API_HASH: ${LOCAL_BOT_API_HASH}
      TELEGRAM_LOCAL: "1"
    ports:
      - "8081:8081"
    volumes:
      - storage:/var/lib/telegram-bot-api

volumes:
  pgdata:
  redisdata:
  storage:
